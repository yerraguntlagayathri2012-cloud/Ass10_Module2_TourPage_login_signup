<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .footerbg {
        background-color: goldenrod;
      }
      a:hover {
        background-color: goldenrod;
        font-size: 30px;
      }
      .required {
        color: red;
      }
      .error-message {
        color: red;
        font-size: 14px;
        margin-top: 5px;
      }
      .success-message {
        color: green;
        font-size: 14px;
        margin-top: 5px;
      }
      .signin-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .signin-card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      .btn-signin {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        transition: transform 0.2s;
      }
      .btn-signin:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      .forgot-password {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
      }
      .forgot-password:hover {
        text-decoration: underline;
      }
      .signup-link {
        text-align: center;
        margin-top: 20px;
      }
      .signup-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
      }
      .signup-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
     <nav class="navbar navbar-dark bg-dark fixed-top">
  <div class="container-fluid justify-content-start">
    
    <a class="navbar-brand" href="https://www.facebook.com/gtholidays/">

     <a class="navbar-brand" href="https://www.instagram.com/gtholidays.in/">

    </a>
    <a class="navbar-brand" href="mailto:mail@gsholidays.in">mailto:mail@gsholidays.in</a>
  </div></nav>
   <!-- Navigation controls -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light" style="margin-top: 56px" >
        <div class="container">
            <a href="" class="navbar-brand">GS Holiday</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto text-white">
                    <li class="nav-item"><a class="nav-link fs-5" href="Home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link fs-5" href="Features.Html">Features</a></li>
                    <li class="nav-item"><a class="nav-link fs-5" href="Destinations.html">Destination</a></li>
                    <li class="nav-item"><a class="nav-link fs-5" href="Contact.html">Contact Us</a></li>
                     <li class="nav-item"><a class="nav-link fs-5" href="index.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link fs-5" href="signup.html">signUp</a></li>
                </ul>

    <div class="signin-container">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-7 col-sm-9">
            <div class="signin-card p-5">
              <h2 class="text-center mb-4 fw-bold">Welcome Back</h2>
              <p class="text-center text-muted mb-4">Sign in to your account</p>

              <form id="signinform">
                <!-- Email Field -->
                <div class="mb-3">
                  <label class="form-label" for="signinEmail">
                    Email Address<span class="required">*</span>
                  </label>
                  <input
                    class="form-control"
                    name="email"
                    id="signinEmail"
                    placeholder="enter.email@example.com"
                    type="email"
                    required
                  />
                  <div class="error-message" id="emailError"></div>
                </div>

                <!-- Password Field -->
                <div class="mb-3">
                  <label class="form-label" for="signinPassword">
                    Password<span class="required">*</span>
                  </label>
                  <input
                    class="form-control"
                    id="signinPassword"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                  />
                  <div class="form-check mt-2">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="showPasswordCheck"
                    />
                    <label class="form-check-label" for="showPasswordCheck">
                      Show Password
                    </label>
                  </div>
                  <div class="error-message" id="passwordError"></div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="rememberMe"
                    />
                    <label class="form-check-label" for="rememberMe">
                      Remember me
                    </label>
                  </div>
                  <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg fw-bold btn-signin">
                    Sign In
                  </button>
                </div>

                <!-- Sign Up Link -->
                <div class="signup-link">
                  <p class="text-muted">
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="signin.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>
