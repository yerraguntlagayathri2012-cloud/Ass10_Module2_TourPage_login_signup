    <div class="container my-5 p-4">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <form id="signupform" class="border p-4 rounded shadow-sm">
            <div class="row g-3 mb-3">
              <div class="col-md-12">
                <label class="form-label" for="">Full Name<span class="required">*</span></label>
                <input class="form-control" name="fullName" id="FName" placeholder="Enter Your Name" type="text" required />
              </div>
               <div class="error-message" id="fullNameError" style="display: none;"></div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-12">
                <label class="form-label" for="">Email  <span class="required">*</span></label>
                <input class="form-control" name="email" id="email"   placeholder="enter.email@example.com" type="email" required />
              </div>
               <div class="error-message" id="emailError" style="display: none;"></div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-12">
                <label class="form-label" for="">Phone No<span class="required">*</span></label>
                <input class="form-control" id="PhoneNo" name="phone" 
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10" type="number" required />
              </div>
               <div class="error-message" id="phoneError" style="display: none;"></div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-12">
                <label class="form-label" for="">City<span class="required">*</span></label>
                <input class="form-control" id="City" type="text"     name="city" 
                        placeholder="Enter your city" required />
              </div>
               <div class="error-message" id="locationError" style="display: none;"></div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-12">
                <label class="form-label" for="">Password<span class="required">*</span></label>
                <input class="form-control" id="Password" type="password" name="Password" placeholder="At least 8 characters, letters & numbers" required />
                <input type="checkbox" id="CBPassword" > Show Password
              </div>
              <div class="error-message" id="passwordError" style="display: none;"></div>
             <!--   /////////////// ////////////////////  -->
              <!-- <button type="button" onclick="togglePassword"  >click to show password</button> -->
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-12">
                <label class="form-label" for="">Confirm Password<span class="required">*</span></label>
                <input class="form-control" id="CPassword" type="password"  name="confirmPassword" 
                            placeholder="Re-enter your password"  required />
                 <input type="checkbox" id="CBcPassword" > Show Password
              </div>
              <div class="error-message" id="confirmPasswordError" style="display: none;"></div>
               <!--   /////////////// ////////////////////  -->
              <!-- <button type="button" class="toggle-password" data-target="CPassword">Click to Show password</button> -->
            </div>

            <!-- <div class="d-grid gap-2"> -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg fw-bold">Create Account</button>
                
              </button>
            </div>
          </form>
        </div>
      </div>
